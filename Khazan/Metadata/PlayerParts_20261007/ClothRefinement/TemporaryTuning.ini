[ClothRefinement]
; Assistant temporary feel values. Original-game physics export unconfirmed.
; Relative to Hair: angular limits x1.1, drive omega /1.1, angular damping x0.9.
ContactRadiusCm=1
MassPerLengthKgPerCm=0.003
RootOmegaPerSecond=25.454545
TipOmegaPerSecond=9.090909
RootSwingDegrees=8.8
TipSwingDegrees=19.8
RootTwistDegrees=3.3
TipTwistDegrees=6.6
LinearDampingPerSecond=0.1
RootAngularDampingPerSecond=1.35
TipAngularDampingPerSecond=0.72
CoincidentAnchorToleranceCm=1
; Assistant stability tuning, engine API settings, not original game values.
FixedTimeStepSeconds=0.016666667
PositionIterations=24
UseLinearJointSolverTorso=true
UseLinearJointSolverLeg=false
TrimTerminalBackwardsOverlap=true

; Temporary bounded-angle policy; SLERP restoring drive remains unchanged.
HardAngularLimits=true
; Optional observed attachment pin is disabled while hard limits are verified.
AdditionalProtectedAttachmentBonesLeg=

; Assistant temporary chain stability policy: collisions do not torque upstream cloth joints.
ParentDominates=false

; Assistant temporary bounded post-solve correction for new cloth joints only.
ProjectionAngularAlpha=0.8
VelocityIterations=4
ProjectionIterations=4

; Assistant support-selection policy from actual largest vertex skin weight, no arbitrary weight threshold.
UseDominantTerminalSupport=true

; Assistant virtual-inertia policy: actual minimum principal moment >= original thin maximum, with mass/contact geometry preserved.
RotationInvariantInertiaConditioning=true

; Assistant collision support policy, measured dominant cloth panel width; Leg only.
UseDominantClothStripBoxesLeg=true

; Assistant temporary Leg-only angular inertia multiplier for measured broad strip collisions.
UniformPrincipalInertiaFloorMultiplierLeg=4

; Calculated support from all dominant vertices of each selected rigid cloth box, including real longitudinal and normal span.
UseFullDominantClothStripBoundsLeg=true

; Assistant temporary Leg root collision-clearance envelope; restoring omega/damping still Hair-relative.
RootSwingDegreesLeg=32
